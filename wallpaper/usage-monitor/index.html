<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Usage Monitor</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a19; }
  #wait {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #898781; font: 2.2vmin system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
  }
</style>
</head>
<body>
<!-- Wallpaper Engine 웹 배경화면 껍데기. 화면 자체는 usage-monitor 수신기가 내주는 /web/wall.html 이다.
     수신기가 응답할 때까지 5초마다 확인하고, 응답하면 이 페이지가 그 주소로 이동한다.
     iframe 으로 불러오지 않는다. Wallpaper Engine 의 브라우저가 다른 출처의 iframe 을 띄우다 렌더러가 죽었다.
     이동한 뒤의 재연결(SSE)은 수신기 쪽 페이지가 스스로 한다. -->
<div id="wait">usage-monitor 수신기 대기 중</div>
<script>
  var base = 'http://127.0.0.1:4318';
  var timer = null;
  var wait = document.getElementById('wait');

  function probe() {
    clearTimeout(timer);
    // no-cors: 응답 내용은 읽지 못하지만 서버가 살아 있는지는 알 수 있다. 수신기에 CORS 설정이 필요 없다
    fetch(base + '/api/snapshot', { mode: 'no-cors', cache: 'no-store' })
      .then(function () { location.replace(base + '/web/wall.html'); })
      .catch(function () {
        wait.textContent = 'usage-monitor 수신기 대기 중 · ' + base;
        timer = setTimeout(probe, 5000);
      });
  }

  // Wallpaper Engine 사용자 속성: 수신기 주소
  window.wallpaperPropertyListener = {
    applyUserProperties: function (props) {
      if (props.receiverurl && props.receiverurl.value) {
        base = String(props.receiverurl.value).trim().replace(/\/+$/, '');
      }
    }
  };

  // 속성이 먼저 들어오도록 잠깐 기다렸다가 확인을 시작한다
  timer = setTimeout(probe, 300);
</script>
</body>
</html>
