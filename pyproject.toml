[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "usage-monitor"
version = "0.1.1"
description = "Claude Code 사용량·한도 대시보드. 로컬 수신기와 키오스크·위젯 화면"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pywebview>=5.0",
    "pystray>=0.19",
    "pillow>=10.0",
]

[project.scripts]
usage-monitor = "usage_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["usage_monitor*"]

[tool.setuptools.package-data]
usage_monitor = ["web/*"]
